# Exemplo sem segredos reais. Copie para secrets.yaml, substitua todos os
# placeholders e nunca versione o arquivo resultante.
apiVersion: v1
kind: Secret
metadata:
  name: vehicle-core-secrets
  namespace: vehicle-core
  labels:
    app.kubernetes.io/part-of: tech-challenge-fase-4
type: Opaque
stringData:
  MYSQL_DATABASE: vehicle_core
  MYSQL_USER: core_app
  MYSQL_PASSWORD: CHANGE_ME_CORE_DB_PASSWORD
  MYSQL_ROOT_PASSWORD: CHANGE_ME_CORE_DB_ROOT_PASSWORD
  DATABASE_URL: mysql+aiomysql://core_app:CHANGE_ME_CORE_DB_PASSWORD@core-mysql.vehicle-core.svc.cluster.local:3306/vehicle_core
  JWT_SECRET: CHANGE_ME_WITH_AT_LEAST_32_RANDOM_CHARACTERS
  SERVICE_TOKEN: CHANGE_ME_SHARED_INTERNAL_SERVICE_TOKEN
  WEBHOOK_SECRET: CHANGE_ME_EXTERNAL_WEBHOOK_SECRET
---
