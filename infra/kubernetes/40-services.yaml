apiVersion: v1
kind: Service
metadata:
  name: vehicle-core-service
  namespace: vehicle-core
  labels:
    app.kubernetes.io/name: vehicle-core-service
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vehicle-core-service
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: vehicle-core-nodeport
  namespace: vehicle-core
  labels:
    app.kubernetes.io/name: vehicle-core-service
    app.kubernetes.io/component: api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: vehicle-core-service
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
---
