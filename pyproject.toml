[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vehicle-core-service"
version = "1.0.0"
description = "Serviço principal do Tech Challenge SOAT - Fase 4"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiomysql>=0.2.0,<1.0.0",
  "alembic>=1.13.3,<2.0.0",
  "argon2-cffi>=23.1.0,<26.0.0",
  "email-validator>=2.2.0,<3.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.27.2,<1.0.0",
  "pydantic>=2.9.2,<3.0.0",
  "pydantic-settings>=2.5.2,<3.0.0",
  "PyJWT>=2.9.0,<3.0.0",
  "SQLAlchemy[asyncio]>=2.0.35,<3.0.0",
  "uvicorn[standard]>=0.30.6,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20.0,<1.0.0",
  "pytest>=8.3.3,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "pytest-cov>=5.0.0,<7.0.0",
  "ruff>=0.7.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

